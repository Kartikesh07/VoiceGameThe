<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="hangar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#090a0f"/>
        <stop offset="50%" stop-color="#141721"/>
        <stop offset="100%" stop-color="#241b17"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#hangar)"/>
    <!-- Industrial Girders -->
    <g stroke="#262f3f" stroke-width="12">
      <line x1="100" y1="0" x2="100" y2="800"/>
      <line x1="1100" y1="0" x2="1100" y2="800"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
    </g>
    <!-- Colossal Mecha Silhouette Head & Torso -->
    <polygon points="600,180 520,320 540,420 660,420 680,320" fill="#1a2230" stroke="#37455c" stroke-width="4"/>
    <!-- Glowing Visor -->
    <polygon points="560,330 640,330 630,350 570,350" fill="#bef264"/>
    <!-- Massive Shoulders -->
    <polygon points="510,340 320,370 300,540 520,480" fill="#151b26" stroke="#2a3547" stroke-width="4"/>
    <polygon points="690,340 880,370 900,540 680,480" fill="#151b26" stroke="#2a3547" stroke-width="4"/>
    <!-- Welding Sparks -->
    <g fill="#f59e0b">
      <circle cx="340" cy="420" r="3"/><circle cx="355" cy="435" r="2"/><circle cx="330" cy="445" r="4"/>
      <circle cx="365" cy="410" r="2"/><circle cx="320" cy="430" r="1.5"/><circle cx="350" cy="460" r="3"/>
    </g>
  </svg>