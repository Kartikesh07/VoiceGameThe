<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="warmNoir" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0c0e12"/>
        <stop offset="60%" stop-color="#161922"/>
        <stop offset="100%" stop-color="#241e1b"/>
      </linearGradient>
      <radialGradient id="softLight" cx="60%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#warmNoir)"/>
    <circle cx="700" cy="350" r="400" fill="url(#softLight)"/>
    <!-- Minimalist Architectural wall slats -->
    <g fill="#1a1f2c" opacity="0.6">
      <rect x="100" y="60" width="25" height="580" rx="4"/>
      <rect x="150" y="60" width="25" height="580" rx="4"/>
      <rect x="200" y="60" width="25" height="580" rx="4"/>
      <rect x="250" y="60" width="25" height="580" rx="4"/>
      <rect x="300" y="60" width="25" height="580" rx="4"/>
    </g>
    <!-- Lounge Chair Silhouette -->
    <path d="M680,640 L710,480 C720,440 760,420 800,430 L850,445 C890,455 910,490 900,530 L870,640 Z" fill="#2c3344"/>
    <path d="M580,640 L640,490 C650,450 620,410 580,410 L510,410 C470,410 440,450 450,490 L510,640 Z" fill="#1b212f"/>
    <!-- Floor lamp with lime accent -->
    <line x1="980" y1="200" x2="980" y2="680" stroke="#64748b" stroke-width="6"/>
    <polygon points="930,260 1030,260 1000,190 960,190" fill="#bef264" opacity="0.85"/>
  </svg>