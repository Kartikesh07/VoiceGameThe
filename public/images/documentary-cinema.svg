<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="cinemaBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#040609"/>
        <stop offset="50%" stop-color="#0b1019"/>
        <stop offset="100%" stop-color="#141a27"/>
      </linearGradient>
      <linearGradient id="flare" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
        <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#bef264" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#cinemaBg)"/>
    <!-- Anamorphic lens flare -->
    <rect x="0" y="380" width="1200" height="10" fill="url(#flare)" opacity="0.75"/>
    <ellipse cx="600" cy="385" rx="180" ry="16" fill="#38bdf8" opacity="0.3"/>
    <circle cx="600" cy="385" r="45" fill="#f8fafc" opacity="0.8"/>
    <!-- Cinema Clapperboard / Camera Silhouette -->
    <g transform="translate(420, 260)">
      <rect x="0" y="0" width="360" height="250" rx="16" fill="#18202c" stroke="#334155" stroke-width="6"/>
      <line x1="0" y1="80" x2="360" y2="80" stroke="#bef264" stroke-width="4"/>
      <polygon points="40,20 80,20 60,60 20,60" fill="#f8fafc"/>
      <polygon points="120,20 160,20 140,60 100,60" fill="#f8fafc"/>
      <polygon points="200,20 240,20 220,60 180,60" fill="#f8fafc"/>
      <polygon points="280,20 320,20 300,60 260,60" fill="#f8fafc"/>
      <text x="40" y="140" fill="#bef264" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="2">SCENE: ARCHIVAL</text>
      <text x="40" y="190" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="4">ROLL 04 // 4K CINEMA</text>
    </g>
    <!-- Film reel marks top and bottom -->
    <g fill="#0b1019">
      <rect x="15" y="20" width="50" height="40" rx="6"/><rect x="15" y="740" width="50" height="40" rx="6"/><rect x="95" y="20" width="50" height="40" rx="6"/><rect x="95" y="740" width="50" height="40" rx="6"/><rect x="175" y="20" width="50" height="40" rx="6"/><rect x="175" y="740" width="50" height="40" rx="6"/><rect x="255" y="20" width="50" height="40" rx="6"/><rect x="255" y="740" width="50" height="40" rx="6"/><rect x="335" y="20" width="50" height="40" rx="6"/><rect x="335" y="740" width="50" height="40" rx="6"/><rect x="415" y="20" width="50" height="40" rx="6"/><rect x="415" y="740" width="50" height="40" rx="6"/><rect x="495" y="20" width="50" height="40" rx="6"/><rect x="495" y="740" width="50" height="40" rx="6"/><rect x="575" y="20" width="50" height="40" rx="6"/><rect x="575" y="740" width="50" height="40" rx="6"/><rect x="655" y="20" width="50" height="40" rx="6"/><rect x="655" y="740" width="50" height="40" rx="6"/><rect x="735" y="20" width="50" height="40" rx="6"/><rect x="735" y="740" width="50" height="40" rx="6"/><rect x="815" y="20" width="50" height="40" rx="6"/><rect x="815" y="740" width="50" height="40" rx="6"/><rect x="895" y="20" width="50" height="40" rx="6"/><rect x="895" y="740" width="50" height="40" rx="6"/><rect x="975" y="20" width="50" height="40" rx="6"/><rect x="975" y="740" width="50" height="40" rx="6"/><rect x="1055" y="20" width="50" height="40" rx="6"/><rect x="1055" y="740" width="50" height="40" rx="6"/><rect x="1135" y="20" width="50" height="40" rx="6"/><rect x="1135" y="740" width="50" height="40" rx="6"/>
    </g>
  </svg>