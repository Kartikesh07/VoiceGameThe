<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <radialGradient id="planetGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#4facfe"/>
        <stop offset="45%" stop-color="#002244"/>
        <stop offset="85%" stop-color="#040914"/>
        <stop offset="100%" stop-color="#010307"/>
      </radialGradient>
      <linearGradient id="spaceAtmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#020409"/>
        <stop offset="50%" stop-color="#080c18"/>
        <stop offset="100%" stop-color="#111726"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#spaceAtmosphere)"/>
    <!-- Stars -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="120" cy="90" r="1.5"/><circle cx="280" cy="140" r="1"/><circle cx="450" cy="70" r="2"/><circle cx="700" cy="110" r="1"/>
      <circle cx="890" cy="80" r="1.5"/><circle cx="1050" cy="160" r="1"/><circle cx="1120" cy="60" r="2.5"/><circle cx="950" cy="300" r="1"/>
      <circle cx="130" cy="400" r="1.5"/><circle cx="210" cy="650" r="1"/><circle cx="1080" cy="600" r="1.5"/>
    </g>
    <!-- Gas Giant Planet -->
    <circle cx="920" cy="450" r="320" fill="url(#planetGrad)"/>
    <!-- Atmospheric glow ring around planet -->
    <circle cx="920" cy="450" r="324" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.4"/>
    <!-- Orbital Rings -->
    <ellipse cx="920" cy="450" rx="550" ry="120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" transform="rotate(-18 920 450)"/>
    <ellipse cx="920" cy="450" rx="580" ry="130" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.2" transform="rotate(-18 920 450)"/>
    <!-- Station silhouette -->
    <g transform="translate(180, 220)">
      <!-- Main Hub -->
      <circle cx="200" cy="200" r="45" fill="#1a2332" stroke="#2b3b52" stroke-width="3"/>
      <circle cx="200" cy="200" r="16" fill="#0f172a" stroke="#bef264" stroke-width="2"/>
      <!-- Ring -->
      <circle cx="200" cy="200" r="140" fill="none" stroke="#223044" stroke-width="12"/>
      <circle cx="200" cy="200" r="140" fill="none" stroke="#bef264" stroke-dasharray="8 30" stroke-width="4" opacity="0.8"/>
      <!-- Spokes -->
      <line x1="200" y1="60" x2="200" y2="340" stroke="#334155" stroke-width="6"/>
      <line x1="60" y1="200" x2="340" y2="200" stroke="#334155" stroke-width="6"/>
      <!-- Solar arrays -->
      <rect x="360" y="165" width="160" height="70" fill="#0284c7" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <line x1="340" y1="200" x2="360" y2="200" stroke="#94a3b8" stroke-width="4"/>
      <rect x="-120" y="165" width="160" height="70" fill="#0284c7" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <line x1="40" y1="200" x2="60" y2="200" stroke="#94a3b8" stroke-width="4"/>
    </g>
  </svg>