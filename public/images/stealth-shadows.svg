<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="noirSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#05070a"/>
        <stop offset="60%" stop-color="#0f141d"/>
        <stop offset="100%" stop-color="#1a2230"/>
      </linearGradient>
      <linearGradient id="searchCone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
        <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#noirSky)"/>
    <!-- Searchlight beam -->
    <polygon points="1100,50 300,750 500,800 1150,50" fill="url(#searchCone)"/>
    <!-- Rooftop silhouette -->
    <rect x="0" y="520" width="450" height="280" fill="#090c10"/>
    <rect x="420" y="460" width="380" height="340" fill="#0d1117"/>
    <rect x="760" y="540" width="440" height="260" fill="#080a0e"/>
    <!-- Water tower on roof -->
    <rect x="200" y="380" width="90" height="110" rx="10" fill="#151b24"/>
    <line x1="210" y1="490" x2="200" y2="520" stroke="#151b24" stroke-width="5"/>
    <line x1="280" y1="490" x2="290" y2="520" stroke="#151b24" stroke-width="5"/>
    <!-- Agent crouching on rooftop ledge -->
    <ellipse cx="610" cy="430" rx="12" ry="10" fill="#bef264"/>
    <polygon points="595,440 625,440 635,462 585,462" fill="#000000"/>
    <!-- Rain mist texture -->
    <g stroke="#ffffff" opacity="0.12" stroke-width="1">
