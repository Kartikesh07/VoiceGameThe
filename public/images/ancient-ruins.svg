<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="twilight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#080912"/>
        <stop offset="50%" stop-color="#141a2b"/>
        <stop offset="100%" stop-color="#22312b"/>
      </linearGradient>
      <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#bef264" stop-opacity="0.8"/>
        <stop offset="70%" stop-color="#bef264" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#bef264" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#twilight)"/>
    <!-- Distant Mountains -->
    <polygon points="-50,550 250,280 550,550" fill="#101726" opacity="0.7"/>
    <polygon points="350,600 680,240 1000,600" fill="#0e1520" opacity="0.8"/>
    <polygon points="750,580 1020,310 1280,580" fill="#090d14"/>
    <!-- Giant Monolith Pillars -->
    <polygon points="220,700 240,180 330,170 310,700" fill="#1a202c" stroke="#2d3748" stroke-width="2"/>
    <polygon points="370,720 380,260 450,250 430,720" fill="#141a24"/>
    <polygon points="760,700 780,140 880,150 860,700" fill="#1c2430" stroke="#2d3748" stroke-width="2"/>
    <!-- Overturned collapsed arch -->
    <polygon points="300,200 810,170 800,230 310,250" fill="#171e28"/>
    <!-- Floating magical rune fragments -->
    <circle cx="560" cy="350" r="80" fill="url(#glowG)"/>
    <polygon points="560,310 590,360 530,360" fill="#bef264" opacity="0.9"/>
    <polygon points="560,390 530,340 590,340" fill="#bef264" opacity="0.7"/>
    <!-- Traveler silhouette -->
    <ellipse cx="560" cy="590" rx="14" ry="12" fill="#0a0c10"/>
    <polygon points="545,602 575,602 580,670 540,670" fill="#0a0c10"/>
    <!-- Staff with light -->
    <line x1="585" y1="580" x2="585" y2="670" stroke="#0a0c10" stroke-width="3"/>
    <circle cx="585" cy="578" r="7" fill="#bef264"/>
    <!-- Foreground terrain & moss -->
    <path d="M0,660 Q300,620 600,650 T1200,640 L1200,800 L0,800 Z" fill="#0f1515"/>
    <path d="M0,710 Q400,670 800,700 T1200,690 L1200,800 L0,800 Z" fill="#0a0d0d"/>
  </svg>