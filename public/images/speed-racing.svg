<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="nightTrack" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#08090f"/>
        <stop offset="60%" stop-color="#141124"/>
        <stop offset="100%" stop-color="#2a0d24"/>
      </linearGradient>
      <linearGradient id="speedTrails" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#bef264"/>
        <stop offset="50%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#f43f5e"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#nightTrack)"/>
    <!-- Anti-gravity track curves -->
    <path d="M0,700 Q500,450 1200,600" fill="none" stroke="#252c3d" stroke-width="60"/>
    <path d="M0,700 Q500,450 1200,600" fill="none" stroke="#bef264" stroke-width="4" stroke-dasharray="20 20"/>
    <!-- High speed light streaks -->
    <path d="M120,670 C400,500 700,530 1100,620" fill="none" stroke="url(#speedTrails)" stroke-width="8" opacity="0.8"/>
    <path d="M80,685 C380,515 720,545 1120,635" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <!-- Anti-grav Hovercraft silhouette -->
    <polygon points="680,530 760,515 820,535 740,555" fill="#f8fafc"/>
    <ellipse cx="690" cy="542" rx="14" ry="4" fill="#bef264"/>
    <polygon points="680,530 620,535 680,545" fill="#00f2fe" opacity="0.7"/>
  </svg>